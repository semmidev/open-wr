# .goreleaser.yaml
# Production release configuration for Open Waiting Room (open-wr) using GoReleaser v2
version: 2

project_name: open-wr

before:
  hooks:
    - go mod tidy

builds:
  - id: open-wr
    main: ./cmd/server
    binary: owr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -extldflags '-static'
      - -X main.version={{.Version}}
      - -X main.buildTime={{.Date}}
      - -X main.commit={{.Commit}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - config.example.yaml
      - docker-compose.yml

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge branch
  groups:
    - title: "🚀 Features"
      regexp: '^feat[(\w\s)]*:'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^fix[(\w\s)]*:'
      order: 1
    - title: "⚡ Performance & Refactoring"
      regexp: '^(perf|refactor)[(\w\s)]*:'
      order: 2
    - title: "🛠️ Maintenance & Infrastructure"
      regexp: '^(build|ci|chore)[(\w\s)]*:'
      order: 3
    - title: "📋 Documentation"
      regexp: '^docs[(\w\s)]*:'
      order: 4
    - title: "📦 Others"
      order: 999

release:
  github:
    owner: semmidev
    name: open-wr
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## 📦 Open Waiting Room Release {{ .Version }} ({{ .Date }})

    High-performance Open Source Waiting Room edge proxy service binary package.

  footer: |
    ---
    *Automated release generated by [GoReleaser](https://goreleaser.com) & GitHub Actions.*
