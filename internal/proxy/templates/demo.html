<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Origin Demo — Open WR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-ink-navy: #0b3558;
      --color-signal-blue: #006bff;
      --color-slate-gray: #476788;
      --color-cloud: #f8f9fb;
      --color-paper: #ffffff;
      --color-pebble: #f0f3f8;
      --color-hairline: #d4e0ed;
      --color-coral-magenta: #e55cff;
      --color-sky-cyan: #0099ff;
      --font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --shadow-card: rgba(71, 103, 136, 0.04) 0px 4px 5px 0px, rgba(71, 103, 136, 0.03) 0px 8px 15px 0px, rgba(71, 103, 136, 0.08) 0px 30px 50px 0px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--color-cloud);
      color: var(--color-ink-navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Decorative Blobs */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }
    .bg-blob-magenta {
      width: 360px;
      height: 360px;
      background: var(--color-coral-magenta);
      top: -80px;
      right: -80px;
    }
    .bg-blob-cyan {
      width: 400px;
      height: 400px;
      background: var(--color-sky-cyan);
      bottom: -100px;
      left: -100px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--color-paper);
      border: 1px solid var(--color-hairline);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: #e6f7ed;
      color: #0d8a4f;
      border: 1px solid #bcead0;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--color-ink-navy);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--color-slate-gray);
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 20px;
    }
    code {
      background: var(--color-pebble);
      border: 1px solid var(--color-hairline);
      color: var(--color-ink-navy);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 24px;
      background: var(--color-signal-blue);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.15s ease, transform 0.15s ease;
      box-shadow: rgba(71, 103, 136, 0.04) 0px 4px 5px 0px, rgba(71, 103, 136, 0.06) 0px 15px 30px 0px;
    }
    .btn:hover {
      background: #0056cc;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <!-- Ambient Soft Blobs -->
  <div class="bg-blob bg-blob-magenta"></div>
  <div class="bg-blob bg-blob-cyan"></div>

  <div class="card">
    <div class="badge">
      <span>✓</span> Access Granted
    </div>
    <h1>Origin Demo Server</h1>
    <p>Selamat! Kamu telah berhasil melewati <strong>Open WR (Open Source Waiting Room)</strong> dan mengakses origin server.</p>
    <p>Target Path: <code>{{.Path}}</code></p>
    <a href="/" class="btn">Kembali ke Beranda</a>
  </div>
</body>
</html>
