<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Origin Demo — Open WR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;580&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Claude Design System Tokens */
      --color-bone-parchment: #f8f8f6;
      --color-paper-white: #ffffff;
      --color-soft-stone: #efeeeb;
      --color-carbon-ink: #121212;
      --color-graphite: #373734;
      --color-ashen: #7b7974;
      --color-chalk: #e7e6e1;
      --color-clay: #d97757;
      --font-serif: 'Source Serif 4', Georgia, Cambria, "Times New Roman", serif;
      --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --shadow-soft: rgba(0, 0, 0, 0.04) 0px 4px 20px 0px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-bone-parchment);
      color: var(--color-carbon-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      position: relative;
    }

    .card {
      position: relative;
      background: var(--color-paper-white);
      border: 1px solid var(--color-chalk);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow-soft);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--color-soft-stone);
      color: var(--color-carbon-ink);
      border: 1px solid var(--color-chalk);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .clay-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--color-clay);
      display: inline-block;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-carbon-ink);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--color-ashen);
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 20px;
    }
    code {
      background: var(--color-soft-stone);
      border: 1px solid var(--color-chalk);
      color: var(--color-graphite);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 24px;
      background: var(--color-carbon-ink);
      color: var(--color-bone-parchment);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 8px;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="clay-dot"></span> Access Granted
    </div>
    <h1>Origin Demo Server</h1>
    <p>Selamat! Kamu telah berhasil melewati <strong>Open WR (Open Source Waiting Room)</strong> dan mengakses origin server.</p>
    <p>Target Path: <code>{{.Path}}</code></p>
    <a href="/" class="btn">Kembali ke Beranda</a>
  </div>
</body>
</html>
